<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Contact Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      padding:40px;
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    form{
      display:flex;
      flex-direction:column;
    }

    label{
      margin-top:15px;
      margin-bottom:5px;
      font-weight:bold;
    }

    input,
    textarea,
    select{
      padding:12px;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:16px;
    }

    textarea{
      resize:vertical;
      min-height:120px;
    }

    fieldset{
      margin-top:20px;
      padding:15px;
      border:1px solid #ccc;
      border-radius:5px;
    }

    legend{
      font-weight:bold;
      padding:0 10px;
    }

    .radio-group{
      margin-top:10px;
    }

    .radio-group label{
      font-weight:normal;
      margin-left:5px;
    }

    button{
      margin-top:20px;
      padding:12px;
      border:none;
      background:#222;
      color:white;
      font-size:16px;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#444;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Contact Form</h1>

  <form aria-label="Contact Form">

    <!-- Name -->
    <label for="fullname">Full Name</label>

    <input
      type="text"
      id="fullname"
      name="fullname"
      required
      aria-required="true"
      aria-label="Enter your full name"
    >

    <!-- Email -->
    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      name="email"
      required
      aria-required="true"
      aria-label="Enter your email address"
    >

    <!-- Phone -->
    <label for="phone">Phone Number</label>

    <input
      type="tel"
      id="phone"
      name="phone"
      aria-label="Enter your phone number"
    >

    <!-- Subject -->
    <label for="subject">Subject</label>

    <select
      id="subject"
      name="subject"
      required
      aria-required="true"
      aria-label="Select subject"
    >
      <option value="">Select an option</option>
      <option value="general">General Inquiry</option>
      <option value="support">Support</option>
      <option value="feedback">Feedback</option>
    </select>

    <!-- Message -->
    <label for="message">Message</label>

    <textarea
      id="message"
      name="message"
      required
      aria-required="true"
      aria-label="Enter your message"
    ></textarea>

    <!-- Preferred Contact Method -->
    <fieldset>

      <legend>Preferred Contact Method</legend>

      <div class="radio-group">

        <input
          type="radio"
          id="contact-email"
          name="contact-method"
          value="email"
        >

        <label for="contact-email">Email</label>

      </div>

      <div class="radio-group">

        <input
          type="radio"
          id="contact-phone"
          name="contact-method"
          value="phone"
        >

        <label for="contact-phone">Phone</label>

      </div>

    </fieldset>

    <!-- Submit -->
    <button type="submit">
      Submit
    </button>

  </form>

</div>

</body>
</html>
